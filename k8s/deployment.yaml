# DATA 789 - HW4 - graded core: the fraud API Deployment.
# 3 replicas, resource requests+limits, readiness/liveness/startup probes,
# zero-drop rolling-update strategy. Runs the provided Project 2 fraud image as-is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustbank-fraud
  labels:
    app: trustbank-fraud
    course: data789
    assignment: hw4
    owner: asa8
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: trustbank-fraud
  template:
    metadata:
      labels:
        app: trustbank-fraud
        color: blue
        owner: asa8
    spec:
      enableServiceLinks: false
      containers:
        - name: fraud
          image: ghcr.io/rfsalas/trustbank-fraud:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3